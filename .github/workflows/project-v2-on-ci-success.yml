name: Project v2 - CI Passed -> Update PR Status

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  on_success:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Add PR(s) to Project and set Status
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          STATUS_FIELD_NAME: ${{ vars.PROJECT_STATUS_FIELD }}
          STATUS_VALUE: ${{ vars.STATUS_CI_PASSED }}
        with:
          script: |
            // =========================
            // CONFIG
            // =========================
            const token = process.env.GH_TOKEN;
            const owner = process.env.PROJECT_OWNER;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const statusFieldName = process.env.STATUS_FIELD_NAME || "Status";
            const statusValue = process.env.STATUS_VALUE || "Ready";

            if (!token) throw new Error("Missing secret PROJECTS_TOKEN.");
            if (!owner) throw new Error("Missing variable PROJECT_OWNER.");
            if (!projectNumber) throw new Error("Missing/invalid variable PROJECT_NUMBER.");

            // const octokit = github.getOctokit(token);

            const run = context.payload.workflow_run;
            const repoOwner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = run.head_sha;

            // 1) PRs associated with commit SHA
            const prsRes = await octokit.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: repoOwner, repo, commit_sha: sha
            });

            const prs = prsRes.data || [];
            if (prs.length === 0) {
              core.info(`No PR associated with SHA ${sha}. Nothing to update.`);
              return;
            }

            // 2) Load Project + status option
            async function getProjectAndStatusOption() {
              const query = `
                query($owner: String!, $number: Int!) {
                  user(login: $owner) {
                    projectV2(number: $number) {
                      id
                      title
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }`;

              const data = await octokit.graphql(query, { owner, number: projectNumber });
              const project = data.user?.projectV2;
              if (!project) throw new Error(`User Project v2 not found for owner="${owner}", number=${projectNumber}.`);

              const statusField = project.fields.nodes.find(f => f?.name === statusFieldName);
              if (!statusField) throw new Error(`Field "${statusFieldName}" not found.`);

              const option = statusField.options.find(o => o.name === statusValue);
              if (!option) {
                const available = statusField.options.map(o => o.name).join(", ");
                throw new Error(`Option "${statusValue}" not found. Available: ${available}`);
              }

              return { projectId: project.id, projectTitle: project.title, fieldId: statusField.id, optionId: option.id };
            }

            async function addToProject(projectId, contentId) {
              const mutation = `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }`;
              const res = await octokit.graphql(mutation, { projectId, contentId });
              return res.addProjectV2ItemById.item.id;
            }

            async function setSingleSelect(projectId, itemId, fieldId, optionId) {
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }`;
              await octokit.graphql(mutation, { projectId, itemId, fieldId, optionId });
            }

            async function findItemForPR(projectId, prNumber) {
              const query = `
                query($projectId: ID!) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content { ... on PullRequest { number } }
                        }
                      }
                    }
                  }
                }`;
              const data = await octokit.graphql(query, { projectId });
              const items = data.node.items.nodes || [];
              const match = items.find(it => it.content?.number === prNumber);
              return match?.id;
            }

            const { projectId, projectTitle, fieldId, optionId } = await getProjectAndStatusOption();
            core.info(`Updating ${prs.length} PR(s) in "${projectTitle}" -> ${statusFieldName}="${statusValue}"`);

            for (const pr of prs) {
              let itemId;
              try {
                itemId = await addToProject(projectId, pr.node_id);
                core.info(`Added PR #${pr.number} to project (itemId=${itemId})`);
              } catch (e) {
                core.warning(`PR #${pr.number} may already be in project. Searching...`);
                itemId = await findItemForPR(projectId, pr.number);
                if (!itemId) throw new Error(`PR #${pr.number} not found in first 100 project items.`);
                core.info(`Found existing item for PR #${pr.number} (itemId=${itemId})`);
              }

              await setSingleSelect(projectId, itemId, fieldId, optionId);
              core.info(`✅ Updated PR #${pr.number}`);
            }
